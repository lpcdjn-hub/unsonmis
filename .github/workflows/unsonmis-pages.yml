name: Deploy UNSONMIS to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "unsonmis/**"
      - ".github/workflows/unsonmis-pages.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload UNSONMIS site
        uses: actions/upload-pages-artifact@v3
        with:
          path: unsonmis
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
