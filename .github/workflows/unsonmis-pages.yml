name: Deploy UNSONMIS to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "unsonmis/**"
      - ".github/workflows/unsonmis-pages.yml"
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload UNSONMIS site
        uses: actions/upload-pages-artifact@v5
        with:
          path: unsonmis

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
