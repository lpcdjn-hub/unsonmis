 <linearGradient id="wetfloor" x2="0" y2="1"><stop stop-color="#111018"/><stop offset=".5" stop-color="#08080d"/><stop offset="1" stop-color="#26212b"/></linearGradient>
 <linearGradient id="metal" x2="0" y2="1"><stop stop-color="#f4f4f4"/><stop offset=".12" stop-color="#424249"/><stop offset=".35" stop-color="#08090d"/><stop offset=".72" stop-color="#202027"/><stop offset="1" stop-color="#777"/></linearGradient>
