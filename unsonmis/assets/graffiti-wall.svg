<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" preserveAspectRatio="xMidYMid slice">
<defs>
 <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#18171b"/><stop offset=".45" stop-color="#08090d"/><stop offset=".83" stop-color="#09090c"/><stop offset="1" stop-color="#171018"/></linearGradient>
 <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#101015"/><stop offset="1" stop-color="#020204"/></linearGradient>
 <radialGradient id="pink"><stop stop-color="#ff47dc" stop-opacity=".95"/><stop offset=".28" stop-color="#ff008d" stop-opacity=".5"/><stop offset="1" stop-color="#ff008d" stop-opacity="0"/></radialGradient>
 <radialGradient id="green"><stop stop-color="#baff36" stop-opacity=".9"/><stop offset=".3" stop-color="#00ff5e" stop-opacity=".5"/><stop offset="1" stop-color="#00ff5e" stop-opacity="0"/></radialGradient>
 <radialGradient id="blue"><stop stop-color="#19eaff" stop-opacity=".8"/><stop offset="1" stop-color="#00aaff" stop-opacity="0"/></radialGradient>
